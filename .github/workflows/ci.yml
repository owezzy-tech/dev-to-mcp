name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dev_to_mcp
          POSTGRES_USER: dev_to_mcp
          POSTGRES_PASSWORD: dev_to_mcp_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev_to_mcp -d dev_to_mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dev_to_mcp:dev_to_mcp_local@127.0.0.1:5432/dev_to_mcp
      REDIS_URL: redis://127.0.0.1:6379
      MCP_BEARER_TOKEN: ci-mcp-bearer-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      - run: cd dashboard && npm ci
      - run: cd dashboard && npm run build
      - run: cd dashboard && npm run test:ci
