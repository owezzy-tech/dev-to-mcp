name: dev-to-mcp-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dev_to_mcp
      POSTGRES_USER: dev_to_mcp
      POSTGRES_PASSWORD: dev_to_mcp_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_to_mcp -d dev_to_mcp"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
